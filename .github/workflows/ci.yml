name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e 'backend[dev]'

      - name: Ruff
        run: ruff check backend

      - name: Validate workflow packs
        run: python -m storybored validate-pack workflows/*/

      - name: Pytest
        run: pytest backend/tests -q

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t storybored:ci .

      - name: Smoke test — server answers /api/health
        run: |
          docker run -d --name sb -p 127.0.0.1:8600:8600 storybored:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8600/api/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs sb
          docker rm -f sb
          test "$ok" = 1
